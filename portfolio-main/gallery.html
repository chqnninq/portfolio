</head>

<body>
  <div class="container">
    <header class="site-header">
      <a class="site-name" href="/">Channing Chen</a>
      <nav class="site-nav">
        <a href="/projects.html">Work</a>
        <a href="/resume.html">Resume</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>

    <div class="page-heading">
      <h1>Gallery</h1>
    </div>

    <section class="section gallery-section">
      <div class="gallery-grid">
        <!-- Add photos to /photos/ and list them here:
        <div class="photo-item">
          <img src="/photos/1.jpg" alt="Photo 1" data-caption="Caption text" onclick="openLightbox(this.src, this.dataset.caption)">
          <div class="photo-caption-overlay">Caption text</div>
        </div>
        -->

      <p class="blog-empty">No photos up yet.</p>

    <footer class="site-footer">

      </div>

    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Full size photo">
      <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>
  </div>

  <script>
    function openLightbox(src, caption) {
      const lightbox = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-caption').textContent = caption || '';
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
